<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
  <title>Bảng Điều Khiển Game Show</title>
  
  <!-- CSS CỐ ĐỊNH DÙNG CHUNG CHO MỌI VÒNG (KHUNG, TAB BAR, SOUNDBOARD) -->
  <style>
    :root {
      --navy-header: #000080;
      --blue-badge: #000099;
      --blue-hover: #000055;
      --yellow-border: #FFFF00;
      --white: #FFFFFF;
      --black: #000000;
      --font-main: "UTM Avo", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: var(--font-main);
    }

    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .container {
      max-width: none;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transform-origin: top left;
      flex-shrink: 0;
    }

    .game-control-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* ==========================================================================
       1. THANH HEADER TAB (TOP NAVBAR - DÙNG CHUNG)
       ========================================================================== */
    .top-navbar {
      width: 100%;
      height: 48px;
      background-color: var(--navy-header);
      display: flex;
      align-items: flex-end;
      padding: 6px 12px 0px 12px;
      gap: 4px;
      border-top-left-radius: 0px;
      border-top-right-radius: 0px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .header-tab-btn {
      height: 32px;
      width: 200px;
      background-color: white;
      color: var(--navy-header);
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 6px 10px;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      border: 1px solid #CCCCCC;
      border-bottom: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .header-tab-btn.active {
      background-color: rgb(255, 213, 0);
      border-color: var(--white);
      opacity: 1;
    }

    .header-tab-btn:hover {
      background-color: #b3b3b3;
    }

    .settings-icon-btn {
      display: flex;
      background: transparent;
      border: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: white;
      transition: all 0.4s ease;
      cursor: pointer;
      margin-left: auto;
      margin-bottom: 6px;
      outline: none;
      flex-shrink: 0;
    }

    .settings-icon-btn:hover {
      color: #00ccff;
      transform: rotate(90deg);
    }

    /* ==========================================================================
       4. KHU VỰC CHẠY NHẠC (SOUNDBOARD - DÙNG CHUNG)
       ========================================================================== */
    .music-panel-container {
      width: 100%;
      background-color: var(--black);
      border-top: 2px solid var(--white);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom-left-radius: 0px;
      border-bottom-right-radius: 0px;
      flex-shrink: 0;
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      width: 100%;
    }

    .music-trigger-btn {
      background-color: var(--blue-badge);
      border: 1.5px solid var(--white);
      border-radius: 2px;
      color: var(--white);
      font-family: var(--font-main);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      white-space: nowrap;
      height: 42px;
      font-size: 18px;
      padding: 2px 4px;
      text-transform: uppercase;
      transition: border-color 1s ease, box-shadow 1s ease, color 1s ease, background-color 0.2s ease;
    }

    .music-trigger-btn.active {
      color: var(--yellow-border);
      box-shadow: 0 0 8px rgba(255, 255, 0, 0.8);
      transition: none;
    }

    /* Trạng thái khi nhạc đang bật: Đổi nền sang đỏ cam nổi bật + chữ vàng */
    .music-trigger-btn.playing {
      background-color: #cc0000 !important;
      color: var(--yellow-border);
      box-shadow: 0 0 10px rgba(255, 213, 0, 0.7);
      transition: background-color 0.15s ease;
    }

    .music-trigger-btn:hover {
      background-color: var(--blue-hover);
      transition: all 0.2s ease;
    }
  </style>

  <!-- NHÚNG CSS RIÊNG CỦA TỪNG VÒNG (MẶC ĐỊNH VÒNG 1) -->
  <link id="round-css" rel="stylesheet" href="Controller_R1.css" />
</head>
<body>

  <div class="container" id="mainContainer">
    <div class="game-control-panel">
      
      <!-- 1. HEADER TAB BAR (CỐ ĐỊNH) -->
      <div class="top-navbar">
        <button class="header-tab-btn" onclick="selectTab(this, 'M')">MAIN</button>
        <button class="header-tab-btn active" onclick="selectTab(this, 'R1')">KHỞI ĐỘNG</button>
        <button class="header-tab-btn" onclick="selectTab(this, 'R2')">VƯỢT CHƯỚNG NGẠI VẬT</button>
        <button class="header-tab-btn" onclick="selectTab(this, 'R3')">TĂNG TỐC</button>
        <button class="header-tab-btn" onclick="selectTab(this, 'R4')">VỀ ĐÍCH</button>
        <button class="header-tab-btn" onclick="selectTab(this, 'SF')">CÂU HỎI PHỤ</button>
        
        <button id="open-option-btn" class="settings-icon-btn" title="Cài đặt / Option" onclick="openConfig()">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
      </div>

      <!-- 2. STATUS BAR -->
      <div class="status-bar-container">
        <div class="status-bar-left">
          <div class="status-info-badge" id="roundBadge"><span id="roundText" class="badge-inner-text">LƯỢT RIÊNG 1</span></div>
          <div class="status-info-badge" id="quesBadge"><span id="quesText" class="badge-inner-text">CÂU HỎI 1/...</span></div>
          <div class="status-info-badge" id="timeBadge"><span id="timeText" class="badge-inner-text">THỜI GIAN: 60s</span></div>
        </div>

        <div class="status-bar-right">
          <button class="player-btn" onclick="triggerAction(this, '1')"><span id="playerBtnText-1" class="badge-inner-text">P1 (0)</span></button>
          <button class="player-btn" onclick="triggerAction(this, '2')"><span id="playerBtnText-2" class="badge-inner-text">P2 (0)</span></button>
          <button class="player-btn" onclick="triggerAction(this, '3')"><span id="playerBtnText-3" class="badge-inner-text">P3 (0)</span></button>
          <button class="player-btn" onclick="triggerAction(this, '4')"><span id="playerBtnText-4" class="badge-inner-text">P4 (0)</span></button>
        </div>
      </div>

      <!-- 3. QUESTION & ANSWER AREA + SIDEBAR BUTTONS -->
      <div class="main-content-grid">
        <div class="qa-column">
          <div class="question-box" id="preview-question">Đang tải câu hỏi...</div>
          <div class="answer-box" id="preview-answer">...</div>
        </div>

        <div class="sidebar-column">
          <button class="sidebar-action-btn" onclick="triggerAction(this, 's')">HIỆN ĐỒ HỌA</button>
          <button class="sidebar-action-btn" onclick="triggerAction(this, 'q')">HIỆN CÂU HỎI</button>
          <button class="sidebar-action-btn" onclick="triggerAction(this, 'n')">CHUYỂN CÂU HỎI</button>
          <button class="sidebar-action-btn" onclick="triggerAction(this, '0')">HIỆN TÊN TS</button>
          <button class="sidebar-action-btn" onclick="triggerScore(this, 'add')">CỘNG ĐIỂM</button>
          <button class="sidebar-action-btn" onclick="triggerScore(this, 'sub')">TRỪ ĐIỂM</button>
          <button class="sidebar-action-btn" onclick="triggerAction(this, 't5')">ĐẾM NGƯỢC 5S</button>
          <button class="sidebar-action-btn" style="background-color: #cc0000;" onclick="triggerAction(this, 'r')">RESET ĐỒ HỌA</button>
          <button class="sidebar-action-btn"></button>
        </div>
      </div>

      <!-- 4. MUSIC PANEL / SOUNDBOARD (CỐ ĐỊNH) -->
      <div class="music-panel-container">
        <div class="music-grid">
          <button class="music-trigger-btn" data-sound="intro" onclick="triggerAudio(this, 'intro')">HOST ENTRANCE</button>
          <button class="music-trigger-btn" data-sound="thinking" onclick="triggerAudio(this, 'thinking')">CONTESTANT ENTRANCE</button>
          <button class="music-trigger-btn" data-sound="tick" onclick="triggerAudio(this, 'tick')">KHỞI ĐỘNG</button>
          <button class="music-trigger-btn" data-sound="correct" onclick="triggerAudio(this, 'correct')">VƯỢT CHƯỚNG NGẠI VẬT</button>
          <button class="music-trigger-btn" data-sound="wrong" onclick="triggerAudio(this, 'wrong')">TĂNG TỐC</button>
          <button class="music-trigger-btn" data-sound="buzz" onclick="triggerAudio(this, 'buzz')">VỀ ĐÍCH</button>
          <button class="music-trigger-btn" data-sound="applause" onclick="triggerAudio(this, 'applause')">Vỗ Tay</button>
          <button class="music-trigger-btn" data-sound="drum" onclick="triggerAudio(this, 'drum')">Trống Trận</button>

          <button class="music-trigger-btn" data-sound="intro_r1" onclick="triggerAudio(this, 'intro_r1')">Nhạc Vòng 1</button>
          <button class="music-trigger-btn" data-sound="intro_r2" onclick="triggerAudio(this, 'intro_r2')">Nhạc Vòng 2</button>
          <button class="music-trigger-btn" data-sound="intro_r3" onclick="triggerAudio(this, 'intro_r3')">Nhạc Vòng 3</button>
          <button class="music-trigger-btn" data-sound="intro_r4" onclick="triggerAudio(this, 'intro_r4')">Nhạc Vòng 4</button>
          <button class="music-trigger-btn" data-sound="congrats" onclick="triggerAudio(this, 'congrats')">Chúc Mừng</button>
          <button class="music-trigger-btn" data-sound="champion" onclick="triggerAudio(this, 'champion')">Nhạc Vô Địch</button>
          <button class="music-trigger-btn" data-sound="warning" onclick="triggerAudio(this, 'warning')">Cảnh Báo</button>
          <button class="music-trigger-btn" data-sound="ending" onclick="triggerAudio(this, 'ending')">Nhạc Kết Thúc</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL CẤU HÌNH VÒNG -->
  <div class="modal-overlay" id="configModal">
    <div class="modal-content" id="configModalContent">
      <div class="modal-header">
        <h2>&#9881; TÙY CHỈNH THÔNG SỐ TRẬN ĐẤU</h2>
        <button class="close-btn" onclick="closeConfig()">✖</button>
      </div>
      
      <div class="config-grid">
        <!-- Cột Trái -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
          <div>
            <div class="config-group-title">Cấu hình chung</div>
            <div class="config-grid" style="gap: 10px;">
              <div class="config-item">
                <label>Số Thí Sinh</label>
                <input type="number" id="numPlayers" value="4" min="2" max="6">
              </div>
              <div class="config-item">
                <label>Trạng thái lượt:</label>
                <select id="turnStatus" onchange="jumpToTurn(this.value)">
                  <option value="rieng">Lượt Riêng</option>
                </select>
              </div>
            </div>
          </div>

          <div>
            <div class="config-group-title">Cấu hình Lượt Riêng</div>
            <div class="config-grid" style="gap: 10px;">
              <div class="config-item"><label>Số Câu</label><input type="number" id="lr_socau" value="6"></div>
              <div class="config-item"><label>Thời gian (s)</label><input type="number" id="lr_thoigian" value="-1" title="-1 là vô hạn"></div>
              <div class="config-item"><label>Điểm Đúng</label><input type="number" id="lr_diemdung" value="10"></div>
              <div class="config-item"><label>Điểm Sai</label><input type="number" id="lr_diemsai" value="0"></div>
            </div>
          </div>
          
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div class="config-group-title" style="margin-bottom: 0;">Cấu hình Lượt Chung</div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <label style="font-size: 13px; font-weight: bold; color: #94a3b8;">Số lượt:</label>
                    <input type="number" id="numLuotChung" value="1" min="0" max="4" style="width: 50px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 4px; padding: 4px; text-align: center;" onchange="renderLuotChungConfigs()">
                </div>
            </div>
            <div id="luotChungList" class="custom-scroll" style="display: flex; flex-direction: column; gap: 15px; max-height: 180px; overflow-y: auto; padding-right: 5px;">
            </div>
          </div>
        </div>

        <!-- Cột Phải: Lưới bảng điểm 4 thí sinh -->
        <div>
          <div class="config-group-title">Quản lý điểm số nhanh</div>
          <div class="players-grid">
            <div class="player-score-card">
              <div class="player-score-name-wrapper">
                <div class="player-score-name" contenteditable="true" id="config-name-1" oninput="compressConfigName(1)" onblur="updateNameDB(1, this.innerText)">P1</div>
              </div>
              <input class="player-score-input" type="number" id="config-score-1" value="0" onchange="updateScoreDB(1, this.value)">
            </div>
            
            <div class="player-score-card">
              <div class="player-score-name-wrapper">
                <div class="player-score-name" contenteditable="true" id="config-name-2" oninput="compressConfigName(2)" onblur="updateNameDB(2, this.innerText)">P2</div>
              </div>
              <input class="player-score-input" type="number" id="config-score-2" value="0" onchange="updateScoreDB(2, this.value)">
            </div>
            
            <div class="player-score-card">
              <div class="player-score-name-wrapper">
                <div class="player-score-name" contenteditable="true" id="config-name-3" oninput="compressConfigName(3)" onblur="updateNameDB(3, this.innerText)">P3</div>
              </div>
              <input class="player-score-input" type="number" id="config-score-3" value="0" onchange="updateScoreDB(3, this.value)">
            </div>
            
            <div class="player-score-card">
              <div class="player-score-name-wrapper">
                <div class="player-score-name" contenteditable="true" id="config-name-4" oninput="compressConfigName(4)" onblur="updateNameDB(4, this.innerText)">P4</div>
              </div>
              <input class="player-score-input" type="number" id="config-score-4" value="0" onchange="updateScoreDB(4, this.value)">
            </div>
          </div>
        </div>
      </div>

      <button class="save-config-btn" onclick="saveRoundConfig()">LƯU CẤU HÌNH</button>
    </div>
  </div>

  <!-- SCRIPT CỐ ĐỊNH DÙNG CHUNG CHO MỌI VÒNG (ĐỒNG BỘ TAB SANG LIVESTREAM, SOUNDBOARD & KHÓA PIXEL) -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD8kOt_miajR8UvjeRF6v9aYy-n1q4uCEE",
      authDomain: "olympia-d2f44.firebaseapp.com",
      databaseURL: "https://olympia-d2f44-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "olympia-d2f44",
      storageBucket: "olympia-d2f44.firebasestorage.app",
      messagingSenderId: "18063059793",
      appId: "1:18063059793:web:5dad7ce59006e779988170",
      measurementId: "G-XVER3NDTXY"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const db = getDatabase(app);

    window.selectTab = function(btn, tabCode) {
      // 1. Đổi hiệu ứng sáng nút Tab
      document.querySelectorAll('.header-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 2. Xác định hậu tố file dựa trên Tab được bấm
      const tabText = btn.innerText.trim().toUpperCase();
      let suffix = tabCode;
      if (!suffix) {
        if (tabText === 'MAIN') suffix = 'M';
        else if (tabText === 'KHỞI ĐỘNG') suffix = 'R1';
        else if (tabText === 'VƯỢT CHƯỚNG NGẠI VẬT') suffix = 'R2';
        else if (tabText === 'TĂNG TỐC') suffix = 'R3';
        else if (tabText === 'VỀ ĐÍCH') suffix = 'R4';
        else if (tabText === 'CÂU HỎI PHỤ') suffix = 'SF';
      }

      if (!suffix) return;

      // 3. Thay đổi file CSS trên Controller (Controller_M.css, Controller_R1.css,...)
      const cssLink = document.getElementById('round-css');
      if (cssLink) {
        cssLink.href = `Controller_${suffix}.css`;
      }

      // 4. Thay đổi và thực thi lại file JS trên Controller (Controller_M.js, Controller_R1.js,...)
      const oldScript = document.getElementById('round-js');
      if (oldScript) {
        oldScript.remove();
      }

      const newScript = document.createElement('script');
      newScript.id = 'round-js';
      newScript.type = 'module';
      newScript.src = `Controller_${suffix}.js?t=${Date.now()}`;
      document.body.appendChild(newScript);

      // 5. Đồng bộ sang màn hình Livestream qua Firebase để Livestream chạy Main.js & Main.css
      set(ref(db, 'games/active_tab'), {
        tab: suffix,
        timestamp: Date.now()
      });
    };

    // =========================================================================
    // CẤU HÌNH DANH SÁCH FILE NHẠC SOUNDBOARD (THƯ MỤC Sounds/)
    // =========================================================================
    const SOUND_FILES = {
      // Hàng 1 (8 nút trên)
      'intro':     'Sounds/HostEntrance.mp3',
      'thinking':  'Sounds/ContestantEntrance.mp3',
      'tick':      'Sounds/R1_intro.mp3',
      'correct':   'Sounds/R2_intro.mp3',
      'wrong':     'Sounds/R3_intro.mp3',
      'buzz':      'Sounds/R4_intro.mp3',
      'applause':  'Sounds/Vo_Tay.mp3',
      'drum':      'Sounds/Trong_Tran.mp3',

      // Hàng 2 (8 nút dưới)
      'intro_r1':  'Sounds/Intro_Vong1.mp3',
      'intro_r2':  'Sounds/Intro_Vong2.mp3',
      'intro_r3':  'Sounds/Intro_Vong3.mp3',
      'intro_r4':  'Sounds/Intro_Vong4.mp3',
      'congrats':  'Sounds/Chuc_Mung.mp3',
      'champion':  'Sounds/Vo_Dich.mp3',
      'warning':   'Sounds/Canh_Bao.mp3',
      'ending':    'Sounds/Ket_Thuc.mp3'
    };

    // Lưu trạng thái bài nào đang phát
    const playingState = {};

    window.triggerAudio = function(btn, soundId) {
      const isCurrentlyPlaying = !!playingState[soundId];

      if (isCurrentlyPlaying) {
        // Nếu nhạc đó ĐANG CHẠY -> Bấm tiếp vào sẽ DỪNG NHẠC và trả nút về bình thường
        playingState[soundId] = false;
        if (btn) {
          btn.classList.remove('playing');
          btn.classList.remove('active');
        }

        set(ref(db, `games/soundboard_status/${soundId}`), false);
        set(ref(db, 'games/soundboard'), {
          soundId: soundId,
          file: SOUND_FILES[soundId] || '',
          action: 'stop',
          timestamp: Date.now()
        });
      } else {
        // Nếu nhạc ĐANG TẮT -> Bấm vào sẽ CHẠY NHẠC và đổi màu nút sang đỏ
        playingState[soundId] = true;
        if (btn) {
          btn.classList.add('playing');
        }

        set(ref(db, `games/soundboard_status/${soundId}`), true);
        set(ref(db, 'games/soundboard'), {
          soundId: soundId,
          file: SOUND_FILES[soundId] || '',
          action: 'play',
          timestamp: Date.now()
        });
      }
    };

    // Lắng nghe trạng thái từ Livestream gửi về (khi nhạc tự phát hết bài thì nút tự về màu bình thường)
    onValue(ref(db, 'games/soundboard_status'), (snapshot) => {
      const statusMap = snapshot.val() || {};
      document.querySelectorAll('.music-trigger-btn').forEach(btn => {
        const sId = btn.getAttribute('data-sound');
        if (!sId) return;

        if (statusMap[sId]) {
          playingState[sId] = true;
          btn.classList.add('playing');
        } else {
          playingState[sId] = false;
          btn.classList.remove('playing');
        }
      });
    });

    // =========================================================================
    // CƠ CHẾ KHÓA CỨNG PIXEL VẬT LÝ (CHỐNG CẢ SCALE WINDOWS LẪN CTRL +/-)
    // =========================================================================
    window.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (
          e.key === '+' || e.key === '-' || e.key === '=' || e.key === '_' || e.key === '0' ||
          e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 107 || e.keyCode === 109 || e.keyCode === 48 || e.keyCode === 96
      )) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('wheel', function(e) {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
      }
    }, { passive: false });

    function lockTruePhysicalSize() {
      const dpr = window.devicePixelRatio || 1;
      const inverseScale = 1 / dpr;

      const container = document.getElementById('mainContainer');
      const modalContent = document.getElementById('configModalContent');

      if (container) {
        container.style.transform = `scale(${inverseScale})`;
        container.style.width = `${100 * dpr}vw`;
        container.style.height = `${100 * dpr}vh`;
      }

      if (modalContent) {
        modalContent.style.transform = `scale(${inverseScale})`;
      }

      if (typeof window.compressBadgeText === 'function') {
        window.compressBadgeText('roundText');
        window.compressBadgeText('quesText');
        window.compressBadgeText('timeText');
        for (let i = 1; i <= 4; i++) {
          window.compressBadgeText(`playerBtnText-${i}`);
        }
      }
    }

    function watchDPRChange() {
      lockTruePhysicalSize();
      const mqString = `(resolution: ${window.devicePixelRatio}dppx)`;
      window.matchMedia(mqString).addEventListener('change', watchDPRChange, { once: true });
    }

    window.addEventListener('resize', lockTruePhysicalSize);
    window.addEventListener('load', watchDPRChange);
    watchDPRChange();
  </script>

  <!-- NHÚNG SCRIPT RIÊNG CỦA VÒNG (MẶC ĐỊNH VÒNG 1) -->
  <script id="round-js" type="module" src="Controller_R1.js"></script>
</body>
