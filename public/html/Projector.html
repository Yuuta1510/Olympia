<!DOCTYPE html>
<html lang="vi">

        <style>
            html, body {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                background-color: transparent;
            }
            #roundIntroVideo {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                z-index: 9999;
                display: none;
                background-color: transparent;
                pointer-events: none;
            }

            #enableSoundBtn {
                position: fixed;
                z-index: 10001;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%);
                padding: 14px 22px;
                border: 2px solid #fff;
                border-radius: 8px;
                background: #b91c1c;
                color: #fff;
                font: 700 18px Arial, sans-serif;
                cursor: pointer;
                box-shadow: 0 4px 16px #0009;
            }

            #enableSoundBtn[hidden] {
                display: none !important;
            }

            #projector-bg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: #000 url('../graphic/r0_bg.png') center / cover no-repeat;
                z-index: -1;
                pointer-events: none;
            }
        </style>
    </head>

        <script type="module">
            import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
            import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";
            import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

            const firebaseConfig = {
                apiKey: "AIzaSyD8kOt_miajR8UvjeRF6v9aYy-n1q4uCEE",
                authDomain: "olympia-d2f44.firebaseapp.com",
                databaseURL: "https://olympia-d2f44-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "olympia-d2f44",
                storageBucket: "olympia-d2f44.firebasestorage.app",
                messagingSenderId: "18063059793",
                appId: "1:18063059793:web:5dad7ce59006e779988170",
                measurementId: "G-XVER3NDTXY"
            };

            const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
            const analytics = getAnalytics(app);
            const db = getDatabase(app);
            window.firebaseDB = db;

            // =====================================================================
            // 0. BỘ ĐIỀU KHIỂN ÂM LƯỢNG RIÊNG BIỆT CHO MÀN PROJECTOR
            // =====================================================================
            const VOLUME_SCREEN_KEY = 'projector';
            const VOLUME_STORAGE_KEY = `olympia_screen_volume_${VOLUME_SCREEN_KEY}`;

            function normalizeScreenVolume(rawVal) {
                const num = Number(rawVal);
                if (!Number.isFinite(num)) return 1;
                return Math.min(1, Math.max(0, num / 100));
            }

            let savedRawVol = 100;
            try {
                const stored = localStorage.getItem(VOLUME_STORAGE_KEY);
                if (stored !== null) savedRawVol = Number(stored);
            } catch (e) {}

            let currentScreenVolume = normalizeScreenVolume(savedRawVol);
            window.__screenMasterVolume = currentScreenVolume;

            const dynamicAudioSet = new Set();
            const nativeVolumeDescriptor = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'volume');

            if (nativeVolumeDescriptor && nativeVolumeDescriptor.get && nativeVolumeDescriptor.set) {
                Object.defineProperty(HTMLMediaElement.prototype, 'volume', {
                    configurable: true,
                    enumerable: nativeVolumeDescriptor.enumerable,
                    get() {
                        return this._baseVolume !== undefined
                            ? this._baseVolume
                            : nativeVolumeDescriptor.get.call(this);
                    },
                    set(val) {
                        const num = Number(val);
                        const base = Number.isFinite(num) ? Math.min(1, Math.max(0, num)) : 1;
                        this._baseVolume = base;
                        nativeVolumeDescriptor.set.call(
                            this,
                            Math.min(1, Math.max(0, base * currentScreenVolume))
                        );
                    }
                });
            }

            function applyScreenVolumeToMedia(el) {
                if (!el) return;
                const base = el._baseVolume !== undefined ? el._baseVolume : 1;
                const finalVol = Math.min(1, Math.max(0, base * currentScreenVolume));
                if (nativeVolumeDescriptor && nativeVolumeDescriptor.set) {
                    nativeVolumeDescriptor.set.call(el, finalVol);
                } else {
                    el.volume = finalVol;
                }
            }

            function syncAllMediaVolume() {
                if (typeof audioCache === 'object' && audioCache !== null) {
                    Object.values(audioCache).forEach(applyScreenVolumeToMedia);
                }
                dynamicAudioSet.forEach(applyScreenVolumeToMedia);
                document.querySelectorAll('audio, video').forEach(applyScreenVolumeToMedia);
            }

            const origMediaPlay = HTMLMediaElement.prototype.play;
            HTMLMediaElement.prototype.play = function (...args) {
                applyScreenVolumeToMedia(this);
                return origMediaPlay.apply(this, args);
            };

            const OrigAudio = window.Audio;
            window.Audio = function (...args) {
                const audio = new OrigAudio(...args);
                applyScreenVolumeToMedia(audio);
                dynamicAudioSet.add(audio);
                audio.addEventListener('ended', () => dynamicAudioSet.delete(audio), { once: true });
                return audio;
            };
            window.Audio.prototype = OrigAudio.prototype;

            const mediaVolumeObserver = new MutationObserver((mutations) => {
                for (const mutation of mutations) {
                    mutation.addedNodes.forEach((node) => {
                        if (node.nodeType !== 1) return;
                        if (node.matches && node.matches('audio, video')) {
                            applyScreenVolumeToMedia(node);
                        }
                        if (node.querySelectorAll) {
                            node.querySelectorAll('audio, video').forEach(applyScreenVolumeToMedia);
                        }
                    });
                }
            });
            mediaVolumeObserver.observe(document.documentElement, { childList: true, subtree: true });

            onValue(ref(db, `games/audio_volume/${VOLUME_SCREEN_KEY}`), (snapshot) => {
                const rawVal = snapshot.exists() ? snapshot.val() : 100;
                currentScreenVolume = normalizeScreenVolume(rawVal);
                window.__screenMasterVolume = currentScreenVolume;
                try {
                    localStorage.setItem(VOLUME_STORAGE_KEY, String(Math.round(currentScreenVolume * 100)));
                } catch (e) {}
                syncAllMediaVolume();
            });

            // =====================================================================
            // 1. ĐỒNG BỘ CHUYỂN TAB (MAIN, R1, R2, R3, R4, R5)
            // =====================================================================
            const tabFileMap = {
                'M': 'Main',
                'R1': 'Round1',
                'R2': 'Round2',
                'R3': 'Round3',
                'R4': 'Round4',
                'R5': 'Round5'
            };

            let currentLoadedTab = 'R1';

            function switchLivestreamFiles(tabCode) {
                const filePrefix = tabFileMap[tabCode];
                if (!filePrefix || currentLoadedTab === tabCode) return;
                currentLoadedTab = tabCode;

                if (typeof window.cleanupCurrentRound === 'function') {
                    window.cleanupCurrentRound();
                    window.cleanupCurrentRound = null;
                }

                const mainUi = document.getElementById('mainGraphicRoot');
                if (mainUi) mainUi.hidden = (tabCode !== 'M');

                const r1Ui = document.getElementById('round1-ui');
                if (r1Ui) r1Ui.style.display = (tabCode === 'R1') ? 'block' : 'none';

                const r2Ui = document.getElementById('r2-projector-ui');
                if (r2Ui) r2Ui.style.display = (tabCode === 'R2') ? 'block' : 'none';

                const r3Ui = document.getElementById('r3-projector-ui');
                if (r3Ui) r3Ui.style.display = (tabCode === 'R3') ? 'block' : 'none';

                const r4Ui = document.getElementById('round4-ui');
                if (r4Ui) r4Ui.style.display = (tabCode === 'R4') ? 'block' : 'none';

                const r5Ui = document.getElementById('round5-ui');
                if (r5Ui) r5Ui.style.display = (tabCode === 'R5') ? 'block' : 'none';

                const cssLink = document.getElementById('projector-css');
                if (cssLink) {
                    cssLink.href = `../css/Projector_${filePrefix}.css`;
                }

                const oldScript = document.getElementById('projector-js');
                if (oldScript) {
                    oldScript.remove();
                }

                const newScript = document.createElement('script');
                newScript.id = 'projector-js';
                newScript.type = 'module';
                newScript.src = `../script/${filePrefix}.js?t=${Date.now()}`;
                document.body.appendChild(newScript);
            }

            onValue(ref(db, 'games/active_tab'), (snapshot) => {
                if (!snapshot.exists()) return;
                const data = snapshot.val();
                if (data && data.tab) {
                    switchLivestreamFiles(data.tab);
                }
            });

            const roundIntroVideo = document.getElementById('roundIntroVideo');

            if (roundIntroVideo) {
                roundIntroVideo.addEventListener('ended', () => {
                    hideRoundIntroVideo();
                });
            }

            function playRoundIntroWithFallback(roundKey, customFile) {
                if (!roundIntroVideo) return;
                const rLower = (roundKey || 'r1').toLowerCase();
                const rUpper = rLower.toUpperCase();
                const baseFile = customFile || `intro_${rLower}.webm`;

                const candidates = [
                    `../graphic/${baseFile}`,
                    `../graphic/${baseFile.toLowerCase()}`,
                    `../graphic/intro_${rLower}.webm`,
                    `../graphic/Intro_${rLower}.webm`,
                    `../graphic/intro_${rUpper}.webm`,
                    `../graphic/Intro_${rUpper}.webm`,
                    `/graphic/${baseFile}`,
                    `Graphic/${baseFile}`,
                    baseFile,
                    `Graphic/intro_${rLower}.webm`,
                    `intro_${rLower}.webm`,
                    `Graphic/Intro_${rLower}.webm`,
                    `Intro_${rLower}.webm`,
                    `Graphic/Intro_${rUpper}.webm`,
                    `Intro_${rUpper}.webm`
                ];

                let idx = 0;
                roundIntroVideo.style.display = 'block';
                roundIntroVideo.muted = false;

                const onPlaySuccess = () => {
                    set(ref(db, 'games/round_intro_status'), rLower);
                };

                const tryNextSource = () => {
                    if (idx >= candidates.length) {
                        console.warn(`Không tìm thấy file video Intro cho vòng ${roundKey}`);
                        hideRoundIntroVideo();
                        return;
                    }
                    roundIntroVideo.src = candidates[idx++];
                    roundIntroVideo.currentTime = 0;
                    roundIntroVideo.play()
                        .then(onPlaySuccess)
                        .catch((err) => {
                            if (err && err.name === 'NotAllowedError') {
                                roundIntroVideo.muted = true;
                                roundIntroVideo.play()
                                    .then(onPlaySuccess)
                                    .catch(() => tryNextSource());
                            } else {
                                tryNextSource();
                            }
                        });
                };

                roundIntroVideo.onerror = () => {
                    tryNextSource();
                };

                tryNextSource();
            }

            function hideRoundIntroVideo() {
                if (!roundIntroVideo) return;
                roundIntroVideo.onerror = null;
                roundIntroVideo.style.display = 'none';
                roundIntroVideo.pause();
                roundIntroVideo.currentTime = 0;
                set(ref(db, 'games/round_intro_status'), null);
            }

            set(ref(db, 'games/round_intro_status'), null);
            let isInitialIntroLoad = true;

            onValue(ref(db, 'games/round_intro'), (snapshot) => {
                if (isInitialIntroLoad) {
                    isInitialIntroLoad = false;
                    return;
                }
                if (!snapshot.exists() || !roundIntroVideo) return;

                const data = snapshot.val();
                if (!data) return;

                if (data.action === 'play') {
                    playRoundIntroWithFallback(data.round || 'r1', data.file);
                } else if (data.action === 'hide') {
                    hideRoundIntroVideo();
                }
            });

            let isInitialCmdLoad = true;
            onValue(ref(db, 'games/commands'), (snapshot) => {
                if (isInitialCmdLoad) {
                    isInitialCmdLoad = false;
                    return;
                }
                if (!snapshot.exists()) return;
                const data = snapshot.val();
                if (data && (data.action === 'reset_graphic' || data.action === 'reset_main_graphic')) {
                    hideRoundIntroVideo();
                }
            });

            // =====================================================================
            // 3. BỘ PHÁT NHẠC SOUNDBOARD TRỰC TIẾP TRÊN MÀN PROJECTOR
            // =====================================================================
            const soundIdForFileName = fileName => fileName.replace(/[^A-Za-z0-9_-]/g, '_');
            const soundFileNames = [
                'Main_15s.mp3', 'Main_1st.mp3', 'Main_2nd.mp3', 'Main_3rd.mp3',
                'Main_4th.mp3', 'Main_Award.mp3', 'Main_Blanks.mp3',
                'Main_ContestantEntrance.mp3', 'Main_DLDN2008.mp3', 'Main_DLDN2010.mp3',
                'Main_DLDN2010_Instrument.mp3', 'Main_HostEntrance.mp3',
                'Main_Introduction1.mp3', 'Main_Introduction2.mp3', 'Main_Introduction3.mp3',
                'Main_Introduction4.mp3', 'Main_Introduction5.mp3', 'Main_PointSummary.mp3',
                'R1_Bed1.mp3', 'R1_Bed2.mp3', 'R1_End.mp3', 'R1_Intro.mp3', 'R1_60s.mp3',
                'R1_Start.mp3', 'R2_Intro.mp3', 'R2_Right.mp3', 'R2_RightObs.mp3',
                'R2_Wrong.mp3', 'R3_Intro.mp3', 'R3_Right.mp3', 'R3_Wrong.mp3',
                'R4_15s.mp3', 'R4_20s.mp3', 'R4_20sPrac.mp3', 'R4_30s.mp3',
                'R4_30sPrac.mp3', 'R4_40sPrac.mp3', 'R4_60sPrac.mp3', 'R4_Begin.mp3',
                'R4_End.mp3', 'R4_Intro.mp3', 'R4_Star.mp3',
                'R5_ShowQues.mp3', 'R5_15s.mp3', 'R5_Buzzed.mp3'
            ];
            const SOUND_FILES = soundFileNames.reduce((files, fileName) => {
                files[soundIdForFileName(fileName)] = `../sounds/${fileName}`;
                return files;
            }, {});

            const audioCache = {};
            const activeSounds = {};
            const soundCommandVersions = {};
            const activePlaybackVersions = {};
            const enableSoundBtn = document.getElementById('enableSoundBtn');
            let pendingAudioPlayback = null;

            function createAudioInstance(soundId, fileUrl) {
                const audio = new Audio(fileUrl);
                audio.preload = 'auto';
                applyScreenVolumeToMedia(audio);
                audio.onended = () => {
                    if (!activeSounds[soundId] || activePlaybackVersions[soundId] !== soundCommandVersions[soundId]) return;
                    activeSounds[soundId] = false;
                    set(ref(db, `games/soundboard_status/${soundId}`), false);
                };
                return audio;
            }

            Object.keys(SOUND_FILES).forEach(id => {
                audioCache[id] = createAudioInstance(id, SOUND_FILES[id]);
            });
            syncAllMediaVolume();

            enableSoundBtn.addEventListener('click', () => {
                const pending = pendingAudioPlayback;
                if (!pending || soundCommandVersions[pending.soundId] !== pending.commandVersion) {
                    enableSoundBtn.hidden = true;
                    pendingAudioPlayback = null;
                    return;
                }

                pending.audio.currentTime = 0;
                pending.audio.play().then(() => {
                    if (soundCommandVersions[pending.soundId] !== pending.commandVersion) return;
                    activeSounds[pending.soundId] = true;
                    activePlaybackVersions[pending.soundId] = pending.commandVersion;
                    pendingAudioPlayback = null;
                    enableSoundBtn.hidden = true;
                    set(ref(db, `games/soundboard_status/${pending.soundId}`), true);
                }).catch(error => {
                    console.warn(`Không thể bật âm thanh [${pending.fileUrl}] trên Projector:`, error);
                    enableSoundBtn.textContent = 'Không bật được âm thanh — nhấn để thử lại';
                });
            });

            let isInitialSoundLoad = true;

            onValue(ref(db, 'games/soundboard'), (snapshot) => {
                if (isInitialSoundLoad) {
                    isInitialSoundLoad = false;
                    return;
                }
                if (!snapshot.exists()) return;

                const data = snapshot.val();
                if (!data || !data.soundId) return;

                const soundId = data.soundId;
                const fileUrl = data.file || SOUND_FILES[soundId];
                const resolvedFileUrl = fileUrl ? new URL(fileUrl, document.baseURI).href : '';

                if (resolvedFileUrl && (!audioCache[soundId] || audioCache[soundId].src !== resolvedFileUrl)) {
                    audioCache[soundId] = createAudioInstance(soundId, fileUrl);
                }

                const audio = audioCache[soundId];
                if (!audio) return;

                const shouldStop = data.action === 'stop';
                const commandVersion = (soundCommandVersions[soundId] || 0) + 1;
                soundCommandVersions[soundId] = commandVersion;
                if (pendingAudioPlayback && pendingAudioPlayback.soundId === soundId) {
                    pendingAudioPlayback = null;
                    enableSoundBtn.hidden = true;
                }

                if (shouldStop) {
                    activeSounds[soundId] = false;
                    audio.pause();
                    audio.currentTime = 0;
                    audio.playbackRate = 1;
                    set(ref(db, `games/soundboard_status/${soundId}`), false);
                } else {
                    activeSounds[soundId] = true;
                    activePlaybackVersions[soundId] = commandVersion;
                    const rate = Number(data.playbackRate);
                    audio.playbackRate = (Number.isFinite(rate) && rate > 0) ? rate : 1;
                    audio.currentTime = 0;
                    audio.play().then(() => {
                        if (activeSounds[soundId] && soundCommandVersions[soundId] === commandVersion) {
                            set(ref(db, `games/soundboard_status/${soundId}`), true);
                        }
                    }).catch(err => {
                        console.warn(`Không thể phát nhạc [${fileUrl}] trên Projector:`, err);
                        if (soundCommandVersions[soundId] === commandVersion) {
                            activeSounds[soundId] = false;
                            set(ref(db, `games/soundboard_status/${soundId}`), false);
                            if (err.name === 'NotAllowedError') {
                                pendingAudioPlayback = { soundId, audio, commandVersion, fileUrl };
                                enableSoundBtn.textContent = `Bật âm thanh để phát ${soundId}`;
                                enableSoundBtn.hidden = false;
                            }
                        }
                    });
                }
            });
        </script>

        <!-- NHÚNG SCRIPT ĐỘNG CHO PROJECTOR (MẶC ĐỊNH Round1.js) -->
        <script id="projector-js" type="module" src="../script/Round1.js"></script>
    </body>
