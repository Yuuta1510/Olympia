<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóp hẹp ngang Text theo tham số</title>
    <style>
        .container {
            border: 2px solid black;
            width: 500px;
            height: 30px;
            margin: 20px auto;
            padding: 10px 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .text-line {
            font-family: Arial, sans-serif;
            font-size: 18px;
            white-space: nowrap; 
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-line" id="line1">Dòng 1 dài test căn lề trái để xem bị bóp như thế nào</div>
    </div>

    <script>
        function compressText(elementId, maxWidth, align) {
            const el = document.getElementById(elementId);
            if (!el) return;

            // 1. Dựa vào tham số align để set cả vị trí lề và tâm bóp chữ
            if (align === 'left') {
                el.style.alignSelf = 'flex-start';
                el.style.transformOrigin = 'left';
            } else if (align === 'right') {
                el.style.alignSelf = 'flex-end';
                el.style.transformOrigin = 'right';
            } else { // Còn lại là giữa
                el.style.alignSelf = 'center';
                el.style.transformOrigin = 'center';
            }

            // 2. Trả về trạng thái gốc để đo chiều dài thật
            el.style.transform = 'none';
            const originalWidth = el.scrollWidth;

            // 3. Nếu vượt quá chiều dài cho phép thì tiến hành bóp
            if (originalWidth >= maxWidth) {
                const scaleRatio = maxWidth / originalWidth;
                el.style.transform = `scaleX(${scaleRatio})`;
            }
        }

        // --- THỰC THI ---
        const MAX_WIDTH = 300; // Khớp với width của .container

        // Gọi hàm cho từng dòng với tham số lề mong muốn
        compressText('line1', MAX_WIDTH);
    </script>
</body>
</html>
